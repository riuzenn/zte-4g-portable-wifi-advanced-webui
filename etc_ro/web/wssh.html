<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>wssh</title>
  <link rel="stylesheet" href="/xterm.css">
  <style>html,body{margin:0;padding:0;height:100%;background:#000;color-scheme:dark;}#t{height:100%;width:100%;}</style>
</head>
<body>
<div id="t"></div>
<script src="/xterm.js"></script>
<script src="/xterm-fit.js"></script>
<script>
var term = new Terminal({ cursorBlink:true, fontSize:14, scrollback:4000 });
var fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('t'));
fit.fit();

var ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
ws.binaryType = 'arraybuffer';

function sendSize() {
  if (!ws || ws.readyState !== 1) return;
  if (term.cols > 0 && term.rows > 0)
    ws.send(JSON.stringify({ type:'resize', cols:term.cols, rows:term.rows }));
}
function fitNow() { fit.fit(); sendSize(); }

ws.onopen  = function() { term.writeln('-- connected --'); sendSize(); };
ws.onclose = function() { term.writeln(''); term.writeln('-- closed --'); };
ws.onmessage = function(e) {
  if (e.data instanceof ArrayBuffer) term.write(new Uint8Array(e.data));
  else term.write(e.data);
};
term.onData(function(d) { if (ws.readyState === 1) ws.send(d); });
window.addEventListener('resize', fitNow);
term.onResize(function() { sendSize(); });
</script></body></html>
